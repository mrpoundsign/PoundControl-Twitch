name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Test & Wasm Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run go fix -diff
        run: |
          DIFF="$(go fix -diff ./...)"
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Run Full Test Suite
        run: go test -count=1 -v ./...

      - name: Build Wasm Plugin
        run: |
          chmod +x ./build.sh
          ./build.sh wasm
