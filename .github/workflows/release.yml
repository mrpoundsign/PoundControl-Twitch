name: Release PoundControl-Twitch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Determine Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
    steps:
      - name: Compute Release Metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RAW_VER="${TAG_NAME#v}"
            IS_TAG="true"
          else
            RAW_VER="0.1.0-snapshot"
            TAG_NAME="v${RAW_VER}"
            IS_TAG="false"
          fi
          IS_PRERELEASE="false"
          if [[ "${RAW_VER}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"

  release:
    name: Quality Gate, Build & Release
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run go fix -diff
        run: |
          DIFF="$(go fix -diff ./...)"
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Run Full Test Suite
        run: go test -count=1 -v ./...

      - name: Build Wasm Release Artifact
        env:
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
        run: |
          chmod +x ./build.sh
          VERSION="${{ needs.meta.outputs.version }}" ./build.sh wasm
          mkdir -p dist
          cp -f build/bin/poundcontrol-twitch.wasm dist/poundcontrol-twitch.wasm

      - name: Consolidate Checksums
        run: |
          cd dist
          rm -f checksums.txt SHA256SUMS.txt
          TMP_SUMS="$(mktemp)"
          for f in *; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> "$TMP_SUMS"
          done
          sort -u -k2 -o checksums.txt "$TMP_SUMS"
          rm -f "$TMP_SUMS"
          cp -f checksums.txt SHA256SUMS.txt
          echo "=== Final Consolidated dist/checksums.txt ==="
          cat checksums.txt

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitch-wasm-dist
          path: dist/

      - name: Attest Build Provenance (SLSA OIDC)
        if: needs.meta.outputs.is_tag == 'true'
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish GitHub Release
        if: needs.meta.outputs.is_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            FLAGS=(--verify-tag --generate-notes)
            if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
